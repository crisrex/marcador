<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marcador en directo</title>
<!--
  CÓMO USARLO
  1. Crea un proyecto en https://console.firebase.google.com
  2. Añade una app web y copia su configuración en firebaseConfig (abajo).
  3. Crea una Realtime Database. Comprueba que firebaseConfig incluye databaseURL.
  4. Importa marcador-rtdb.json (menú ⋮ > Importar JSON). Crea esta estructura:
       marcador/partido/nombreLocal      "Equipo A"
       marcador/partido/nombreVisitante  "Equipo B"
       marcador/partido/local            0
       marcador/partido/visitante        0
  5. Reglas de Realtime Database para la demo (lectura pública, nadie escribe
     desde la web; tú editas desde la consola, que no pasa por las reglas):
       {
         "rules": {
           "marcador": {
             ".read": true,
             ".write": false
           }
         }
       }
  6. Abre esta página en varios dispositivos y cambia los números en la consola.
-->
<style>
  :root {
    --bg: #0f1420;
    --panel: #1a2133;
    --text: #f4f6fb;
    --muted: #8a94ad;
    --local: #ff6b4a;
    --visit: #4aa8ff;
    --ok: #3ddc84;
    --ko: #ff4a6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    gap: 28px;
  }
  .estado {
    display: flex; align-items: center; gap: 8px;
    font-size: 0.95rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.12em;
  }
  .punto {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--muted);
  }
  .punto.vivo { background: var(--ok); animation: latido 1.6s infinite; }
  .punto.error { background: var(--ko); }
  @keyframes latido {
    0%, 100% { box-shadow: 0 0 0 0 rgba(61,220,132,.6); }
    50% { box-shadow: 0 0 0 8px rgba(61,220,132,0); }
  }
  .marcador {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: clamp(12px, 3vw, 40px);
    background: var(--panel);
    border-radius: 24px;
    padding: clamp(20px, 4vw, 48px) clamp(16px, 5vw, 64px);
    width: min(1000px, 100%);
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  .equipo { text-align: center; }
  .nombre {
    font-size: clamp(1rem, 3vw, 2rem);
    font-weight: 600;
    margin-bottom: 12px;
    overflow-wrap: anywhere;
  }
  .local .nombre { color: var(--local); }
  .visitante .nombre { color: var(--visit); }
  .puntos {
    font-size: clamp(4rem, 18vw, 11rem);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    display: inline-block;
    border-radius: 16px;
    padding: 0 0.15em;
  }
  .separador {
    font-size: clamp(2rem, 8vw, 5rem);
    color: var(--muted);
    font-weight: 300;
  }
  .cambio { animation: destello 0.9s ease-out; }
  @keyframes destello {
    0%   { transform: scale(1.35); background: rgba(255,255,255,.18); }
    100% { transform: scale(1);    background: transparent; }
  }
  .pie { color: var(--muted); font-size: 0.9rem; text-align: center; }
  .pie strong { color: var(--text); font-variant-numeric: tabular-nums; }
  .aviso {
    background: #3a2a14; color: #ffd18a;
    padding: 14px 18px; border-radius: 12px;
    max-width: 640px; text-align: center; display: none;
  }
</style>
</head>
<body>

  <div class="estado"><span class="punto" id="punto"></span><span id="textoEstado">Conectando…</span></div>

  <div class="aviso" id="aviso"></div>

  <main class="marcador">
    <div class="equipo local">
      <div class="nombre" id="nombreLocal">Local</div>
      <div class="puntos" id="puntosLocal">–</div>
    </div>
    <div class="separador">:</div>
    <div class="equipo visitante">
      <div class="nombre" id="nombreVisitante">Visitante</div>
      <div class="puntos" id="puntosVisitante">–</div>
    </div>
  </main>

  <div class="pie">
    Actualizaciones recibidas: <strong id="contador">0</strong> ·
    Última: <strong id="ultima">—</strong>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyARt5noncHIcDDt9NlzCcAJMp1beO7KzVw",
  authDomain: "marcador-e7b0a.firebaseapp.com",
  databaseURL: "https://marcador-e7b0a-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "marcador-e7b0a",
  storageBucket: "marcador-e7b0a.firebasestorage.app",
  messagingSenderId: "976269776491",
  appId: "1:976269776491:web:9b8dc9b8c217b3d5f9032e"
};

  const $ = (id) => document.getElementById(id);

  function estado(texto, clase) {
    $("textoEstado").textContent = texto;
    $("punto").className = "punto " + (clase || "");
  }

  function aviso(texto) {
    $("aviso").textContent = texto;
    $("aviso").style.display = "block";
  }

  // Pone el valor y lanza la animación solo si ha cambiado
  function pintar(id, valor) {
    const el = $(id);
    const nuevo = String(valor ?? "–");
    if (el.textContent !== nuevo) {
      el.textContent = nuevo;
      el.classList.remove("cambio");
      void el.offsetWidth; // reinicia la animación
      el.classList.add("cambio");
    }
  }

  if (firebaseConfig.projectId === "PEGA_AQUI") {
    estado("Sin configurar", "error");
    aviso("Falta la configuración de Firebase: edita firebaseConfig en este archivo.");
  } else {
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let actualizaciones = 0;

    // ⭐ La parte importante: escuchar el nodo en tiempo real.
    // Esta función se ejecuta al cargar y cada vez que el nodo cambia.
    onValue(
      ref(db, "marcador/partido"),
      (snap) => {
        if (!snap.exists()) {
          estado("Sin datos", "error");
          aviso('No existe el nodo "marcador/partido" en Realtime Database.');
          return;
        }
        const d = snap.val();
        $("aviso").style.display = "none";
        estado("En directo", "vivo");

        $("nombreLocal").textContent = d.nombreLocal ?? "Local";
        $("nombreVisitante").textContent = d.nombreVisitante ?? "Visitante";
        pintar("puntosLocal", d.local);
        pintar("puntosVisitante", d.visitante);

        actualizaciones++;
        $("contador").textContent = actualizaciones;
        $("ultima").textContent = new Date().toLocaleTimeString("es-ES");
      },
      (err) => {
        estado("Error", "error");
        aviso("Error al leer Realtime Database: " + err.message);
      }
    );
  }
</script>
</body>
</html>
